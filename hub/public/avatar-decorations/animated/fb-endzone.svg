<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240"><title>End Zone</title><style>.fbendzone-a{transform-box:fill-box;transform-origin:center;transform-origin:50% 100%;animation:fbendzone-h 1.2s ease-in-out infinite}.fbendzone-b{transform-box:fill-box;transform-origin:center;transform-origin:50% 100%;animation:fbendzone-h 1.2s .6s ease-in-out infinite}@keyframes fbendzone-h{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-7px) scaleY(1.06)}55%{transform:translateY(0) scaleY(.92)}}.fbendzone-t{animation:fbendzone-t 1.2s ease-in-out infinite alternate}@keyframes fbendzone-t{from{fill:#fbfaf5}to{fill:#b4ff4d}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M93.59 49.76A106 106 0 0 1 -93.59 49.76" stroke="#2e8b47" stroke-width="22" fill="none"/><path id="fbendzone-tp" d="M-90.78 44.28A101 101 0 0 0 90.78 44.28" fill="none"/><text font-family="'Arial Narrow','Barlow Condensed',Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="2.5" text-anchor="middle" class="fbendzone-t" fill="#fbfaf5"><textPath href="#fbendzone-tp" startOffset="50%">TOUCHDOWN</textPath></text><g transform="translate(-96 74)"><g class="fbendzone-a"><rect x="-7" y="-34" width="14" height="34" rx="3" fill="#ff7a1a"/><rect x="-7" y="-24" width="14" height="5" fill="#fbfaf5"/></g></g><g transform="translate(96 74)"><g class="fbendzone-b"><rect x="-7" y="-34" width="14" height="34" rx="3" fill="#ff7a1a"/><rect x="-7" y="-24" width="14" height="5" fill="#fbfaf5"/></g></g></svg>