<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240"><title>Ankle Breaker</title><style>.bbcrossover-x{animation:bbcrossover-x 1.1s ease-in-out infinite alternate}@keyframes bbcrossover-x{from{transform:translateX(-54px)}to{transform:translateX(54px)}}.bbcrossover-y{animation:bbcrossover-y .55s cubic-bezier(.5,0,.9,.5) infinite alternate}@keyframes bbcrossover-y{from{transform:translateY(-20px)}to{transform:translateY(0)}}.bbcrossover-l{animation:bbcrossover-l 1.1s steps(2,jump-none) infinite}@keyframes bbcrossover-l{from{opacity:.9}to{opacity:.2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="bbcrossover-l" d="M-92 90l-10 6M-88 100l-11 3M92 90l10 6M88 100l11 3" stroke="#fbfaf5" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="0" cy="116" rx="62" ry="3" fill="#0b0d10" opacity=".35"/><g transform="translate(0 100)"><g class="bbcrossover-x"><g class="bbcrossover-y"><circle r="15" fill="#f07a1f"/><path d="M-15 0H15M0 -15V15M-10.8 -10.5Q-2.7 0 -10.8 10.5M10.8 -10.5Q2.7 0 10.8 10.5" stroke="#2b1608" stroke-width="1.5" fill="none"/></g></g></g></svg>