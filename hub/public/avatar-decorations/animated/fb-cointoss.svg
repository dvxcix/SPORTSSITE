<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240"><title>Coin Toss</title><style>.fbcointoss-c{transform-box:fill-box;transform-origin:center;animation:fbcointoss-c 1.1s linear infinite}@keyframes fbcointoss-c{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.08)}}.fbcointoss-u{animation:fbcointoss-u 2.2s ease-in-out infinite alternate}@keyframes fbcointoss-u{to{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(0 -95)"><g class="fbcointoss-u"><g class="fbcointoss-c"><circle r="19" fill="#ffd23f"/><circle r="14.5" fill="none" stroke="#e0b020" stroke-width="2.5"/><path d="M1.8 -10L-5.8 1.2H-0.6L-2.2 10L5.8 -2H0.4Z" fill="#8a6a00"/></g></g></g><path d="M-30 -108l-7 -5M30 -108l7 -5M-34 -94h-8M34 -94h8" stroke="#ffd23f" stroke-width="3" stroke-linecap="round" fill="none"/></svg>