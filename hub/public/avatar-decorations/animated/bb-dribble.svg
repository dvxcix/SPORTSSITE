<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="240" height="240"><title>Handles</title><style>.bbdribble-b{animation:bbdribble-b .62s cubic-bezier(.5,0,.9,.5) infinite alternate}@keyframes bbdribble-b{from{transform:translateY(-62px)}to{transform:translateY(0)}}.bbdribble-q{transform-box:fill-box;transform-origin:center;transform-origin:50% 100%;animation:bbdribble-q .62s cubic-bezier(.5,0,.9,.5) infinite alternate}@keyframes bbdribble-q{0%,82%{transform:scale(1,1)}100%{transform:scale(1.16,.8)}}.bbdribble-s{transform-box:fill-box;transform-origin:center;animation:bbdribble-s .62s cubic-bezier(.5,0,.9,.5) infinite alternate}@keyframes bbdribble-s{from{transform:scale(.45);opacity:.2}to{transform:scale(1);opacity:.55}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="bbdribble-s" cx="78" cy="113" rx="19" ry="4.5" fill="#0b0d10"/><g transform="translate(78 93)"><g class="bbdribble-b"><g class="bbdribble-q"><circle r="19" fill="#f07a1f"/><path d="M-19 0H19M0 -19V19M-13.68 -13.3Q-3.42 0 -13.68 13.3M13.68 -13.3Q3.42 0 13.68 13.3" stroke="#2b1608" stroke-width="1.9" fill="none"/></g></g></g></svg>