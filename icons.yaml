product: SlipSurge for iOS, a sports research and social app
personality: [crisp, energetic, approachable]
sizes: [16, 20, 24]
dir: ios/icons
avoid: [generic charts for unrelated tools, lettering inside icons]
dna:
  style: outline
  stroke: 1.75
  grid: 24
  padding: 1
  keylines: { circle: 20, square: 18, portrait: [16, 20], landscape: [20, 16] }
  corners: { family: circular, radius: { large: 2, small: 1 }, largeThreshold: 8 }
  caps: round
  joins: round
  angles: [0, 45, 90]
  detail: low
  minGap: 1.5
  badge: { position: bottom-right, size: 8, gap: 2 }
